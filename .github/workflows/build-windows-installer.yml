name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/SidePrompter/SidePrompter.csproj

      - name: Publish self-contained single-file (win-x64)
        run: |
          dotnet publish src/SidePrompter/SidePrompter.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o artifacts/win-x64

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y

      - name: Build installer with ISCC
        shell: pwsh
        run: |
          $iss = 'build\installer\sideprompter.iss'
          if (-Not (Test-Path $iss)) { Write-Error "ISS file not found: $iss"; exit 1 }
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' $iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SidePrompter-installer
          path: artifacts\*.exe